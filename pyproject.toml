[project]
name = "quant-research"
version = "0.1.0"
description = "Mid-frequency crypto quant research: data pipeline, backtester, validation, strategies"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14",
    "websockets>=12",
    "aiohttp>=3.9",
    "requests>=2.31",
    "statsmodels>=0.14",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "openpyxl>=3.1",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[tool.setuptools.packages.find]
include = ["qr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
